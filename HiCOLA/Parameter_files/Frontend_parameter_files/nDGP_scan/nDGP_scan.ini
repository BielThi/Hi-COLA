# Here quantities related to objects in reduced Horndeski action are defined
#### Give the model its name
model_name = 'nDGP_scan'

#### Choose where to save the background and force quantity data
output_directory = './Hi-COLA_Output/Frontend/nDGP_scan'

#######################
# Horndeski functions #
#######################

# See documentation for meaning of these functions
K = 6*X
G3 = -2*rc_H0*rc_H0*X
G4 = 0.5

##################
# Theory symbols #
##################

rc_H0_symbol = "rc_H0"

###############################
# Horndeski Parameter values  #
###############################

# rc_H0_parameter is overwritten by Notebooks/scan.ipynb at every scan point using
# rc_H0_parameter = 1 / (E_dS*(-alpha)^(1/4)).
rc_H0_parameter = 1.0

##################################################
# Fraction of cosmological constant in Omega_DE0 #
##################################################

# Overwritten by Notebooks/scan.ipynb.
f_phi = 0.2

######################
# Initial conditions #
######################

# E_dS is overwritten by Notebooks/scan.ipynb. Hubble_dS is kept as a frontend-compatible alias.
E_dS = 1.0
Hubble_dS = 1.0
Hubble0 = 1.0

# This is a dummy variable as we choose phi_prime_0 as the variable to be solved for
# through the Friedmann-like closure relation. The guess value being used for phi_prime_0
# is determined by the "closure_guess_value" variable.
phiprime0 = 1.0

###############
# Mass ratios #
###############

# If True, all mass ratios are set to 1 and values below are ignored
set_all_to_one = True

M_pG4 = 1.
M_KG4 = 1.
M_G3s = 1.
M_sG4 = 1.
M_G3G4 = 1.
M_Ks = 1.
M_gp = 1.

#######################
# Closure declaration #
#######################

# This indicates that the variable to be chosen is either the Hubble function, phi_prime, Omega_m or Omega_r
# If this is false, then one of the Horndeski model parameters will be solved through the closure equation instead
use_constraint_eq_on_odeint_variables = True

# This specifies which odeint variable
# 0 = Hubble function; 1 = phi_prime; 2 = Omega_r; 3 = Omega_m
which_odeint_par = 1

# Relies on the order in which the Horndeski parameters are written above
# Only relevant if use_constraint_eq_on_odeint_parameters is False.
which_Horndeski_par = 0

# Closure guess value
closure_guess_value = 1.0
